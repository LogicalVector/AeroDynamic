function drawYears(){ gYears.innerHTML=''; const ys=[...new Set(dataset.nodes.map(n=>n.year))].sort((a,b)=>a-b); for(const y of ys){ const x=yearX(y); const l=document.createElementNS(NS,'line'); l.setAttribute('x1',x); l.setAttribute('x2',x); l.setAttribute('y1',44); l.setAttribute('y2',H-60); l.setAttribute('class','year-line'); gYears.appendChild(l); const t=document.createElementNS(NS,'text'); t.setAttribute('x',x); t.setAttribute('y',27); t.setAttribute('class','year-label'); t.setAttribute('text-anchor','middle'); t.textContent=y; gYears.appendChild(t); } }
function render(){ dataset.nodes.forEach(n=>{ n.el.classList.toggle('selected',selected===n.id); n.el.setAttribute('transform',`translate(${n.x},${n.y})`); }); dataset.edges.forEach(e=>{ const a=nodeMap.get(e.s),b=nodeMap.get(e.t); const hide=e.weak && !showWeak; e.el.classList.toggle('hidden',hide); e.labelEl.style.display=hide?'none':''; if(hide) return; const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1; const sx=a.x+dx/len*(a.w/2*.84),sy=a.y+dy/len*(a.h/2*.72),ex=b.x-dx/len*(b.w/2*.84),ey=b.y-dy/len*(b.h/2*.72); const mx=(sx+ex)/2,my=(sy+ey)/2,bend=Math.min(40,len*.08),nx=-dy/len,ny=dx/len,cx=mx+nx*bend,cy=my+ny*bend; e.el.setAttribute('d',`M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`); e.labelEl.setAttribute('x',cx); e.labelEl.setAttribute('y',cy-4); }); gRoot.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`); }
function step(){ if(!paused && dataset){ const nodes=dataset.nodes; for(let i=0;i<nodes.length;i++){ const n=nodes[i]; if(n.fixed) continue; let fx=0,fy=0; const targetX=yearX(n.year)+(seeded(n.id+'tx')-.5)*18; const targetY=84+n.seed*(H-200); fx+=(targetX-n.x)*.0032; fy+=(targetY-n.y)*.0018; for(let j=0;j<nodes.length;j++){ if(i===j) continue; const m=nodes[j]; let dx=n.x-m.x,dy=n.y-m.y; const minX=(n.w+m.w)/2+24, minY=(n.h+m.h)/2+22; const ax=Math.abs(dx), ay=Math.abs(dy); if(ax<minX && ay<minY){ const overlapX=minX-ax, overlapY=minY-ay; if(overlapX<overlapY) fx+=(dx>=0?1:-1)*overlapX*.045; else fy+=(dy>=0?1:-1)*overlapY*.045; } const d2=dx*dx+dy*dy+60, dist=Math.sqrt(d2), rep=28000/d2; fx+=dx/dist*rep; fy+=dy/dist*rep; } n.vx=(n.vx+fx)*.86; n.vy=(n.vy+fy)*.86; } for(const e of dataset.edges){ const a=nodeMap.get(e.s),b=nodeMap.get(e.t); let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1; const desired=e.strong?215:255,k=e.strong?.00315:.0015,f=(d-desired)*k,ux=dx/d,uy=dy/d; if(!a.fixed){a.vx+=ux*f;a.vy+=uy*f} if(!b.fixed){b.vx-=ux*f;b.vy-=uy*f} } for(const n of nodes){ if(n.fixed) continue; n.x+=n.vx; n.y+=n.vy; n.x=Math.max(98,Math.min(W-98,n.x)); n.y=Math.max(72,Math.min(H-88,n.y)); } } render(); requestAnimationFrame(step); } requestAnimationFrame(step);
function attachDrag(el,n){ let dragging=false,last=null; el.addEventListener('pointerdown',e=>{ e.stopPropagation(); dragging=true; el.setPointerCapture(e.pointerId); last=toWorld(e.clientX,e.clientY); n.fixed=true; }); el.addEventListener('pointermove',e=>{ if(!dragging) return; const p=toWorld(e.clientX,e.clientY); n.x += p.x-last.x; n.y += p.y-last.y; last=p; render(); }); el.addEventListener('pointerup',()=>{ dragging=false; }); }
function toWorld(cx,cy){ const r=svg.getBoundingClientRect(); return {x:(cx-r.left-tx)/scale,y:(cy-r.top-ty)/scale}; }
svg.addEventListener('pointerdown',e=>{ if(e.target.closest && e.target.closest('.node')) return; pan=true; svg.classList.add('panning'); panStart={x:e.clientX-tx,y:e.clientY-ty}; svg.setPointerCapture(e.pointerId); document.getElementById('info').classList.remove('open'); selected=null; render(); }); svg.addEventListener('pointermove',e=>{ if(!pan) return; tx=e.clientX-panStart.x; ty=e.clientY-panStart.y; render(); }); svg.addEventListener('pointerup',()=>{ pan=false; svg.classList.remove('panning'); }); svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=scale; scale=Math.max(.48,Math.min(2.35,scale*Math.exp(-e.deltaY*.001))); tx=mx-(mx-tx)*(scale/old); ty=my-(my-ty)*(scale/old); render(); },{passive:false});
function selectNode(id){ selected=id; const n=nodeMap.get(id); document.getElementById('infoTitle').textContent=n.full; document.getElementById('infoMeta').textContent=`${n.year} · ${n.venue} · ${dataset.legend.find(x=>x[0]===n.cat)?.[1] || n.cat}`; document.getElementById('infoDesc').textContent=n.desc; document.getElementById('infoTags').innerHTML=n.tags.map(t=>`<span class="tag">${t}</span>`).join(''); document.getElementById('infoContrib').innerHTML=n.contrib.map(x=>`<li>${x}</li>`).join(''); document.getElementById('infoRelevance').textContent=n.relevance; const a=document.getElementById('paperLink'); a.href=n.url||''; a.style.display=n.url?'inline-block':'none'; document.getElementById('info').classList.add('open'); render(); }
document.getElementById('closeInfo').onclick=()=>{ document.getElementById('info').classList.remove('open'); selected=null; render(); }; document.getElementById('weakBtn').onclick=e=>{ showWeak=!showWeak; e.currentTarget.classList.toggle('active',showWeak); e.currentTarget.textContent=showWeak?'显示弱关联':'隐藏弱关联'; render(); }; document.getElementById('pauseBtn').onclick=e=>{ paused=!paused; e.currentTarget.classList.toggle('active',paused); e.currentTarget.textContent=paused?'继续布局':'暂停布局'; }; document.getElementById('releaseBtn').onclick=()=>{ dataset.nodes.forEach(n=>{n.fixed=false;n.vx=n.vy=0;}); }; document.getElementById('resetBtn').onclick=()=>{ resize(true); document.getElementById('info').classList.remove('open'); selected=null; render(); }; document.getElementById('search').addEventListener('input',e=>{ const q=e.target.value.trim().toLowerCase(); dataset.nodes.forEach(n=>{ const blob=[n.short,n.full,n.sub,n.venue,n.desc,...n.tags,...n.contrib].join(' ').toLowerCase(); n.el.classList.toggle('dim',q && !blob.includes(q)); }); if(q){ const hits=dataset.nodes.filter(n=>!n.el.classList.contains('dim')); if(hits.length===1) selectNode(hits[0].id); } }); document.querySelectorAll('.dataset-btn').forEach(btn=>btn.onclick=()=>setDataset(btn.dataset.key)); setDataset('surrogate');
})();
